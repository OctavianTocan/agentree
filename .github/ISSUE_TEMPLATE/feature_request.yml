name: Feature request
description: Propose a new feature or improvement
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the proposed change.
        Large design changes are easier if discussed in an issue before a PR.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Keep it concrete.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about (optional).
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This fits the reductive mission (simplest thing that works; no premature PageIndex machinery)
        - label: I am willing to help implement or review
