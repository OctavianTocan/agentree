name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      - name: Check formatting
        run: uv run ruff format --check agentree tests

      - name: Lint
        run: uv run ruff check agentree tests

      - name: Type check
        run: uv run ty check agentree tests

      - name: Test
        run: uv run pytest -q
