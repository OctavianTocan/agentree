name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # --locked fails if uv.lock has drifted from pyproject.toml, rather than
      # silently re-resolving and testing something other than what's committed.
      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check agentree tests

      - name: Lint
        run: uv run ruff check agentree tests

      - name: Type check
        run: uv run ty check --error-on-warning agentree tests

      - name: Test
        run: uv run pytest -q
