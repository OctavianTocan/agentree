repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-format
        args: [agentree, tests]
        files: ^(agentree/|tests/)
      - id: ruff-check
        args: [agentree, tests]
        files: ^(agentree/|tests/)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: ^(agentree/|tests/)
      - id: end-of-file-fixer
        files: ^(agentree/|tests/)
      - id: check-added-large-files
        args: ['--maxkb=20000']
        # Sample PDFs under examples/documents/ are intentional (largest ~17MB).
      # pyproject.toml now carries the whole lint/type contract: a syntax error in it
      # silently disables the rules rather than failing loudly.
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: debug-statements
        files: ^(agentree/|tests/)
      - id: mixed-line-ending
        args: ['--fix=lf']
        files: ^(agentree/|tests/)

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.22
    hooks:
      # Keep uv.lock honest when pyproject dependencies or requires-python change.
      - id: uv-lock

  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: uv run ty check --error-on-warning agentree tests
        language: system
        pass_filenames: false
        files: ^(agentree/|tests/)
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        files: ^(agentree/|tests/)
