repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-format
        args: [agentree, tests]
        files: ^(agentree/|tests/)
      - id: ruff
        args: [agentree, tests]
        files: ^(agentree/|tests/)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: ^(agentree/|tests/)
      - id: end-of-file-fixer
        files: ^(agentree/|tests/)
      - id: check-added-large-files
        args: ['--maxkb=20000']
        # Sample PDFs under examples/documents/ are intentional (largest ~17MB).

  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: uv run ty check agentree tests
        language: system
        pass_filenames: false
        files: ^(agentree/|tests/)
