[project]
name = "pdf-indexing-pages-for-agents"
version = "0.1.0"
description = "Index PDF documents into a hierarchical section tree for agent retrieval, using Claude or Codex structured completions instead of vector chunking."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["pdf", "indexing", "rag", "agents", "claude", "codex", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "claude-agent-sdk>=0.2.110",
  "httpx>=0.28.1",
  "loguru>=0.7.3",
  "mcp[cli]>=1.28.1",
  "openai-codex",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.2",
  "pypdf>=6.14.2",
  "typer>=0.26.8",
]

[project.scripts]
pdfindex = "pdfindex.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pdfindex"]

[dependency-groups]
dev = [
  "pre-commit>=4.6.0",
  "pytest>=9.1.1",
  "ruff>=0.15.20",
  "ty>=0.0.56",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".agent", "examples", "PageIndex", "docs", "lessons", "reference", "learning-records"]
indent-width = 2

[tool.ruff.format]
preview = true
quote-style = "single"
docstring-code-format = true
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "D", "S", "RUF", "PT", "C90"]
ignore = [
  "D203",   # Incompatible with D211 (no-blank-line-before-class)
  "D213",   # Incompatible with D212 (multi-line-summary-first-line)
  "D401",   # Imperative mood docstrings (too opinionated)
  "RUF001", # Ambiguous unicode character (we use '›' separator)
  "RUF002", # Ambiguous unicode character in docstring
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"pdfindex/indexing/prompts.py" = ["E501"]
"pdfindex/storage/sqlite.py" = ["S608"]
"tests/**/*.py" = ["S101", "D100", "D101", "D102", "D103", "D104", "PT011", "RUF007"]

[tool.uv.sources]
openai-codex = { git = "https://github.com/openai/codex.git", subdirectory = "sdk/python" }
