[project]
name = "agentree"
version = "0.1.0"
description = "Index PDF documents into a hierarchical section tree for agent retrieval, using Claude or Codex structured completions instead of vector chunking."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "Octavian Tocan", email = "contact@octaviantocan.com" }]
keywords = ["pdf", "indexing", "rag", "agents", "claude", "codex", "mcp", "vectorless"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing :: Indexing",
]

dependencies = [
  "claude-agent-sdk>=0.2.118",
  "httpx>=0.28.1",
  "loguru>=0.7.3",
  "mcp[cli]>=1.28.1",
  "openai-codex",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.2",
  "pypdf>=6.14.2",
  "typer>=0.26.8",
]

[project.urls]
Homepage = "https://github.com/OctavianTocan/agentree"
Repository = "https://github.com/OctavianTocan/agentree"
Issues = "https://github.com/OctavianTocan/agentree/issues"
Changelog = "https://github.com/OctavianTocan/agentree/blob/main/CHANGELOG.md"
Security = "https://github.com/OctavianTocan/agentree/blob/main/SECURITY.md"

[project.scripts]
agentree = "agentree.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentree"]

[dependency-groups]
dev = [
  "pre-commit>=4.6.0",
  "pytest>=9.1.1",
  "ruff>=0.15.20",
  "ty>=0.0.57",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [".agent", "examples", "PageIndex", "docs", "lessons", "reference", "learning-records"]
indent-width = 2

[tool.ruff.format]
preview = true
quote-style = "single"
docstring-code-format = true
line-ending = "lf"

[tool.ruff.lint]
# Preview gates DOC, but blanket-enabling it also turns on E111/E114, which demand
# 4-space indents and contradict `indent-width = 2`. Opt in per-rule instead.
preview = true
explicit-preview-rules = true
select = [
  "E", "F", "I", "UP", "B", "N", "D", "S", "RUF", "PT", "C90", "ANN",
  "A", "ARG", "C4", "DTZ", "EM", "FBT", "FURB", "G", "ICN", "INP", "LOG",
  "PERF", "PL", "PTH", "RET", "RSE", "SIM", "SLF", "T20", "TID", "TRY",
  # pydoclint (preview): docstrings must match the signature they document.
  # Exact codes, since `explicit-preview-rules` ignores prefix selection.
  "DOC201", "DOC202", "DOC402", "DOC403", "DOC501", "DOC502",
]
ignore = [
  "D401",    # Imperative mood docstrings (too opinionated)
  "RUF001",  # Ambiguous unicode character (we use '›' separator)
  "RUF002",  # Ambiguous unicode character in docstring
  "TRY003",  # Would force a custom exception class per message; EM101/EM102 already cover this
  "PLC0415", # Function-level imports are deliberate here: lazy SDK loads and import-cycle breaks
]

[tool.ruff.lint.pydocstyle]
# Matches the Args:/Returns:/Raises: style already in use, and turns off the
# D203/D213 pairs that contradict it (previously ignored by hand).
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"agentree/indexing/prompts.py" = ["E501"]
"agentree/storage/sqlite.py" = ["S608"]
"tests/**/*.py" = [
  "S101", "D100", "D101", "D102", "D103", "D104", "PT011", "RUF007",
  "INP001",  # tests/ is a pytest rootdir, not an importable package
  "PLR2004", # Literal expected values are the point of an assertion
  "DOC",     # Test bodies are the documentation; no Returns:/Raises: prose needed
]

[tool.uv.sources]
openai-codex = { git = "https://github.com/openai/codex.git", subdirectory = "sdk/python" }
